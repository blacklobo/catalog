        files:
          - url: git+https://github.com/alpinelinux/aports.git#0492819ba5c0d0da111c0499fb5903f0944b9599
            path: ${source.dir}/aports
            uid: 0
            gid: 0
          - url: https://download.samba.org/pub/samba/stable/samba-4.22.10.tar.gz
            path: /var/cache/distfiles/samba-4.22.10.tar.gz
            uid: 0
            gid: 0
      pipeline:
        - uses: abuild/setup@v1
        - name: unpack samba source
          runs: |
            set -eux -o pipefail

            rm -rf "${source.dir}/samba-4.22.10"
            tar -xzf "/var/cache/distfiles/samba-4.22.10.tar.gz" -C "${source.dir}"
        - name: apply samba security patch
          uses: git/patch@v1
          work-dir: ${source.dir}/samba-4.22.10
          with:
            patch: ${source.dir}/aports/main/samba/dhi-cve-2026-6949-security.patch
        - name: repack patched samba source
          runs: |
            set -eux -o pipefail

            tar -czf "/var/cache/distfiles/samba-4.22.10.tar.gz" -C "${source.dir}" "samba-4.22.10"
        - uses: abuild/bump@v1
          with:
            rel: 1
            version: 4.22.10
        - uses: abuild/build@v1
          with:
