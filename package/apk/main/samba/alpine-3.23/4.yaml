          - acl-dev
          - attr-dev
          - bind-dev
          - bison
          - cups-dev
          - dbus-dev
          - docbook-xsl
          - e2fsprogs-dev
          - flex
          - gnutls-dev
          - icu-dev
          - iniparser-dev
          - jansson-dev
          - libarchive-dev
          - libcap-dev
          - libtirpc-dev
          - liburing-dev
          - linux-pam-dev
          - lmdb-dev
          - musl-nscd-dev
          - ncurses-dev
          - openldap-dev
          - perl
          - perl-parse-yapp
          - popt-dev
          - py3-tdb
          - py3-tevent
          - python3-dev
          - readline-dev
          - rpcgen
          - subunit-dev
          - talloc-dev
          - tdb-dev
          - tevent-dev
          - util-linux-dev
          - zlib-dev
          - py3-cryptography
          - py3.12-dnspython
          - py3.12-markdown
          - py3-setproctitle
