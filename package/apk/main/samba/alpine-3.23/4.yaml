        - uses: abuild/build@v1
      paths:
        - type: file
          path: ${source.dir}/aports/main/samba/dhi-cve-2026-6949-security.patch
          uid: 0
          gid: 0
          mode: "644"
          source: package/apk/main/samba/patch/alpine-3.23/dhi-cve-2026-6949-security.patch
