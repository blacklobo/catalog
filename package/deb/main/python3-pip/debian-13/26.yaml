# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-python3-pip
variant: runtime
tags:
  - 26.2.2-0
  - 26.2.2-0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  DHI_REL: "0"
  DHI_VERSION: 26.2.2-0
  PACKAGE_WORK_DIR: python3-pip
  PIP_CHECKSUM: sha256:fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70
  PIP_URL: https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl
  VERSION: 26.2.2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: python3-pip deb
      work-dir: ${source.dir}/python3-pip
      contents:
        packages:
          - bash
          - coreutils
          - debhelper
          - dpkg-dev
          - python3
          - python3-packaging
          - python3-wheel
          - unzip
        files:
          - url: https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl
            checksum: sha256:fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70
            path: ${source.dir}/python3-pip/pip-26.2.2-py3-none-any.whl
            spdx:
              name: pip
              version: 26.2.2
              packages:
                - name: pip
                  purl: pkg:pypi/pip@26.2.2
                  license: MIT
            uid: 0
            gid: 0
      pipeline:
        - name: unpack pip wheel
          runs: |
            set -eux -o pipefail

            python3 -m wheel unpack pip-26.2.2-py3-none-any.whl --dest pip-wheel
        - name: apply vendored urllib3 CVE patches
          uses: patch@v1
          work-dir: ${source.dir}/python3-pip/pip-wheel/pip-26.2.2
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/dhi-cve-2026-97687-https-proxy-tls-policy.patch
              - ${source.dir}/patch/dhi-cve-2026-97688-deflate-infinite-loop.patch
              - ${source.dir}/patch/dhi-cve-2026-97689-chunk-line-limit.patch
        - name: repack patched pip wheel
          runs: |
            set -eux -o pipefail

            rm pip-26.2.2-py3-none-any.whl
            python3 -m wheel pack pip-wheel/pip-26.2.2 --dest .
        - uses: dpkg/bump@v1
          with:
            changelog:
              - Backport vendored urllib3 fixes for CVE-2026-97687, CVE-2026-97688, and CVE-2026-97689
            version: 26.2.2-0
        - uses: dpkg/build@v1
          with:
            args: -b -uc -us -d
      paths:
        - type: directory
          path: ${source.dir}/python3-pip/debian
          uid: 0
          gid: 0
          mode: "0600"
          source: package/deb/main/python3-pip/debian-13/debian
        - type: directory
          path: ${source.dir}/patch
          uid: 0
          gid: 0
          source: package/deb/main/python3-pip/patch
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
