# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-kibana
variant: runtime
tags:
  - 9.4.8
  - 9.4.8-r3
  - 9.4.8-debian13
  - 9.4.8-r3-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-05-05"
vars:
  ARCH: '#{ target.arch == "amd64" ? "amd64" : "arm64" }'
  COMMIT_SHA: e480f260be8f73cfb3424961a59867631291a2dd
  GO_ARCH: '#{ target.arch == "amd64" ? "x86_64" : "aarch64" }'
  KIBANA_NODE_BUILD_FLAGS: ""
  KIBANA_NODE_RENDER_FLAGS: ""
  NODE_ARCH: '#{ target.arch == "amd64" ? "x64" : "arm64" }'
  NODE_BINARIES_EXTRA_SUBDIR: glibc-217
  NODE_BINARIES_SUBDIR: default
  NODE_MAJOR_VERSION: "24"
  NODE_VERSION: 24.22.0-0
  PACKAGE_NAME: kibana-9.4
  REL: "3"
  SEMVER_MAJOR_MINOR_VERSION: "9.4"
  SEMVER_MAJOR_VERSION: "9"
  SEMVER_VERSION: 9.4.8
  VERSION: 9.4.8
contents:
  packages:
    - '!base-files'
  builds:
    - name: kibana
      work-dir: ${source.dir}/kibana
      caches:
        - path: /root/.local/share/pnpm
        - path: /root/.yarn
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - gzip
          - jq
          - base-files
          - ca-certificates
          - coreutils
          - findutils
          - git
          - libc6
          - libstdc++6
          - mawk
          - nodejs-24=24.22.0-0
          - node-corepack
          - npm
          - sed
          - yarn-classic
        files:
          - url: git+https://github.com/elastic/kibana.git#v9.4.8
            checksum: e480f260be8f73cfb3424961a59867631291a2dd
            path: ${source.dir}/kibana
            spdx:
              name: kibana
              version: 9.4.8
              packages:
                - name: kibana
                  purl: pkg:dhi/kibana@9.4.8
                  license: Elastic-License-2.0
            uid: 65532
            gid: 65532
      pipeline:
        - name: update node engine
          work-dir: ${source.dir}/kibana
          runs: |
            set -eux -o pipefail

            ls -la package.json

            REQUIRED_VERSION=$(sed -nr "s/\"node\": \"([0-9]+)\.[0-9]+\.[0-9]+\".*/\1/p" package.json | tr -d " ")
            if [ "$REQUIRED_VERSION" != "24" ]; then
              echo "Error: upstream requirement for Node v$REQUIRED_VERSION not met by build v24."
              echo "Error: if version change is intentional, update this version verification logic."
              exit 1
            fi

            sed -ir "s/\"node\": \"[0-9]\+\.[0-9]\+\.[0-9]\+\"/\"node\": \"$(node --version | sed 's/^v//')\"/g" package.json
        - name: retain security overrides after pnpm migration (9.4)
          uses: patch@v1
          work-dir: ${source.dir}/kibana
          with:
            options: -p1
            patches:
              - ${source.dir}/patches/pnpm-security-overrides_9.4.patch
        - name: build kibana
          work-dir: ${source.dir}/kibana
          privileged: true
          runs: |
            set -eux -o pipefail

            mkdir -p ${source.dir}/bin
            export PATH=$PATH:${source.dir}/bin
            corepack enable --install-directory ${source.dir}/bin

            echo "startup --batch" > .bazelrc.user

            mkdir -p ~/.moon/plugins/toolchains
            export MOON_TOOLCHAIN_FORCE_GLOBALS=1

            ${source.dir}/bin/pnpm kbn bootstrap

            NODE_RUNTIME_VERSION="$(node --version | sed 's/^v//')"
            populate_node_extract() {
              local variant="$1"
              local platform="$2"
              local extract="${source.dir}/kibana/.node_binaries/${NODE_RUNTIME_VERSION}/${variant}/${platform}/extract"

              mkdir -p "${extract}/bin"
              cp -a /usr/bin/node "${extract}/bin/node"
              node << EOF
            const fs = require('fs');
            const https = require('https');
            const url = 'https://raw.githubusercontent.com/nodejs/node/v${NODE_RUNTIME_VERSION}/LICENSE';
            https.get(url, (res) => {
              if (res.statusCode !== 200) {
                console.error('failed to download Node LICENSE:', res.statusCode);
                process.exit(1);
              }
              const chunks = [];
              res.on('data', (chunk) => chunks.push(chunk));
              res.on('end', () => fs.writeFileSync('${extract}/LICENSE', Buffer.concat(chunks)));
            }).on('error', (err) => {
              console.error(err);
              process.exit(1);
            });
            EOF
            }
            for node_subdir in default glibc-217; do
              if [ -z "${node_subdir}" ]; then
                continue
              fi
              populate_node_extract "${node_subdir}" "linux-x64"
              if [ ${NODE_ARCH} != "x64" ]; then
                populate_node_extract "${node_subdir}" "linux-${NODE_ARCH}"
              fi
            done

            node  -- \
              scripts/build --skip-os-packages --skip-initialize \
              --skip-docker-cloud-fips --skip-docker-contexts --skip-docker-ubi \
              --skip-docker-wolfi --skip-docker-cloud --skip-docker-cloud-fips \
              --skip-docker-serverless --skip-docker-fips

            KBN_DIST="${source.dir}/kibana/build/default/kibana-9.4.8-SNAPSHOT-linux-${GO_ARCH}"
            if [ ! -x "${KBN_DIST}/bin/kibana" ]; then
              cd "${source.dir}/kibana"
              export KBN_VERSION="9.4.8" KBN_GO_ARCH="${GO_ARCH}"
              node  scripts/render-bin-scripts.js
            fi

            mkdir -p "${target.dir}/usr/share/kibana"

            cp -r "${KBN_DIST}"/* "${target.dir}/usr/share/kibana"

            cd "${target.dir}/usr/share/kibana"
            rm -rf data
        - uses: dhi/build-pkg:0
          with:
            depends:
              - bash
              - coreutils
            description: Kibana data visualization and exploration platform
            disableGlobbing: true
            files:
              - usr/share/kibana
            formats:
              - deb
            license: Elastic-License-2.0
            name: kibana-9.4
            rel: 3
            url: https://www.elastic.co/kibana/
            version: 9.4.8
      paths:
        - type: file
          path: ${source.dir}/patches/pnpm-security-overrides_9.4.patch
          uid: 65532
          gid: 65532
          mode: "0444"
          source: package/main/kibana/patch/pnpm-security-overrides_9.4.patch
        - type: file
          path: ${source.dir}/patches/pnpm-security-overrides_9.5.patch
          uid: 65532
          gid: 65532
          mode: "0444"
          source: package/main/kibana/patch/pnpm-security-overrides_9.5.patch
        - type: file
          path: ${source.dir}/kibana/scripts/render-bin-scripts.js
          uid: 65532
          gid: 65532
          mode: "0444"
          source: package/main/kibana/scripts/render-bin-scripts.js
      accounts:
        run-as: node
        users:
          - name: node
            uid: 65532
            gid: 65532
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
