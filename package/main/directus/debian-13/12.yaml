# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-directus
variant: runtime
tags:
  - 12.5.0
  - 12.5.0-r2
  - 12.5.0-debian13
  - 12.5.0-r2-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 4f77933bf9551cac6b289576078783e189b8f4e3
  DHI_TEST_DEB_EXPECTED_FILES: /usr/bin/directus /usr/bin/pm2 /usr/lib/nodejs/directus/cli.js /usr/lib/nodejs/directus/docker-entrypoint.cjs /usr/lib/nodejs/directus/node_modules/@directus/api/dist/cli/run.js
  NODEJS_VERSION: 22.23.3-0
  PYTHON_VERSION: 3.13.16-0
  REL: "2"
  SEMVER_MAJOR_MINOR_VERSION: "12.5"
  SEMVER_MAJOR_VERSION: "12"
  SEMVER_VERSION: 12.5.0
  VERSION: 12.5.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: directus
      work-dir: ${source.dir}/directus
      environment:
        npm_config_python: /usr/bin/python3.13
      caches:
        - path: /root/.local/share/pnpm/store
        - path: /root/.cache
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - findutils
          - grep
          - sed
          - g++
          - gcc
          - libc6-dev
          - make
          - python-3.13=3.13.16-0
          - python-3.13-minimal=3.13.16-0
          - libpython-3.13=3.13.16-0
          - libpython-3.13-minimal=3.13.16-0
          - libpython-3.13-stdlib=3.13.16-0
          - libbz2-1.0
          - libcrypt1
          - libdb5.3t64
          - libexpat1
          - libffi8
          - libgdbm-compat4t64
          - libgdbm6
          - liblzma5
          - libncursesw6
          - libreadline8t64
          - libsqlite3-0
          - libssl3t64
          - libtinfo6
          - libuuid1
          - libzstd1
          - zlib1g
          - libc6
          - libgcc-s1
          - libstdc++6
          - nodejs-22=22.23.3-0
          - nodejs-22-dev=22.23.3-0
          - node-corepack
        files:
          - url: git+https://github.com/directus/directus.git#v12.5.0
            checksum: 4f77933bf9551cac6b289576078783e189b8f4e3
            path: ${source.dir}/directus
            spdx:
              name: directus
              version: 12.5.0
              packages:
                - name: directus
                  purl: pkg:github/directus/directus@12.5.0
                  license: LicenseRef-MSCL-1.0-GPL
            uid: 0
            gid: 0
      pipeline:
        - name: hash the process id with sha-256
          uses: patch@v1
          with:
            options: -p1
            patches:
              - ${source.dir}/patch/dhi-build-fips-process-id.patch
        - name: install, build, test and stage
          privileged: true
          runs: |
            set -eux -o pipefail

            export SOURCE_DIR="${source.dir}" TARGET_DIR="${target.dir}"
            bash "${source.dir}/build.sh"
        - name: deployed node_modules sbom
          uses: sbom@v1
          with:
            extra-scanners: javascript-package-cataloger
            prefix: directus
            source: ${target.dir}/usr/lib/nodejs/directus/node_modules
        - uses: dhi/build-pkg:0
          with:
            depends:
              - nodejs-22
            description: Directus, a real-time REST and GraphQL API and admin app for SQL databases
            files:
              - usr/lib/nodejs/directus
              - usr/bin/directus
              - usr/bin/pm2
            formats:
              - deb
            license: LicenseRef-MSCL-1.0-GPL
            name: directus-12
            rel: 2
            url: https://directus.com
            version: 12.5.0
      paths:
        - type: file
          path: ${source.dir}/build.sh
          uid: 0
          gid: 0
          mode: "0755"
          source: package/main/directus/build.sh
        - type: file
          path: ${source.dir}/patch/dhi-build-fips-process-id.patch
          uid: 0
          gid: 0
          source: package/main/directus/patch/dhi-build-fips-process-id.patch
        - type: file
          path: ${source.dir}/patch/isolated-vm-cstdint.patch
          uid: 0
          gid: 0
          mode: "0644"
          source: package/main/directus/patch/isolated-vm-cstdint.patch
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
