# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-datahub-ingestion
variant: runtime
tags:
  - 1.7.0.16
  - 1.7.0.16-r1
  - 1.7.0.16-debian13
  - 1.7.0.16-r1-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2025-10-01"
vars:
  ACRYL_DATAHUB_SDIST_CHECKSUM: sha256:e8667323427592cb14de2ceecfd471e233b299fe25b45d93d5382c39abcbdb68
  ARCH: '#{ target.arch == "amd64" ? "x86_64" : "aarch64" }'
  EXTRAS: base,datahub-rest,datahub-kafka,snowflake,bigquery,redshift,mysql,postgres,s3-slim,gcs-slim,abs-slim,clickhouse,glue,dbt,looker,lookml,tableau,powerbi,superset,datahub-business-glossary
  PYTHON_MINOR: "3.10"
  PYTHON_VERSION: 3.10.22-0
  REL: "1"
  SEMVER_MAJOR_MINOR_VERSION: "1.7"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.7.0.16
  UV_VERSION: 0.11.23
  VERSION: 1.7.0.16
contents:
  packages:
    - base-files
  builds:
    - name: datahub-ingestion
      work-dir: ${source.dir}
      environment:
        UV_NO_MANAGED_PYTHON: "true"
        UV_PYTHON_DOWNLOADS: never
      caches:
        - path: /root/.cache/uv
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - build-essential
          - ca-certificates
          - coreutils
          - diffutils
          - findutils
          - g++
          - gawk
          - grep
          - gzip
          - libaio-dev
          - libffi-dev
          - libkrb5-dev
          - libldap2-dev
          - librdkafka-dev
          - libsasl2-dev
          - libssl-dev
          - libxml2-dev
          - libxslt1-dev
          - pkg-config
          - sed
          - tar
          - unixodbc-dev
          - libpython-3.10=3.10.22-0
          - libpython-3.10-minimal=3.10.22-0
          - libpython-3.10-stdlib=3.10.22-0
          - python-3.10-minimal=3.10.22-0
          - python-3.10=3.10.22-0
          - python-3.10-dev=3.10.22-0
          - libstdc++6
        files:
          - url: https://github.com/astral-sh/uv/releases/download/0.11.23/uv-${ARCH}-unknown-linux-gnu.tar.gz
            path: ${source.dir}/uv-unknown-linux-gnu.tar.gz
            uid: 0
            gid: 0
          - url: https://files.pythonhosted.org/packages/source/a/acryl-datahub/acryl_datahub-1.7.0.16.tar.gz
            checksum: sha256:e8667323427592cb14de2ceecfd471e233b299fe25b45d93d5382c39abcbdb68
            path: ${source.dir}/acryl_datahub.tar.gz
            spdx:
              name: acryl-datahub
              version: 1.7.0.16
              packages:
                - name: acryl-datahub
                  purl: pkg:pypi/acryl-datahub@1.7.0.16
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: setup uv
          runs: |
            set -eux -o pipefail

            mkdir -p /usr/local/bin
            tar -xzf "${source.dir}/uv-unknown-linux-gnu.tar.gz" -C /usr/local/bin --strip-components=1
            chmod +x /usr/local/bin/uv
        - name: install datahub-ingestion
          privileged: true
          runs: |
            set -eux -o pipefail

            cat > ${source.dir}/overrides.txt << 'EOF'
            urllib3>=2.8.0
            lxml>=6.1.0
            cryptography>=50.0.0
            setuptools>=83.0.0
            sqlparse>=0.6.0
            aiohttp>=3.14.4
            certifi>=2026.10.19
            pip>=26.2.2
            EOF

            UV_LINK_MODE=copy uv pip install \
              --prefix ${target.dir}/usr/lib/datahub-ingestion \
              --override ${source.dir}/overrides.txt \
              "${source.dir}/acryl_datahub.tar.gz[base,datahub-rest,datahub-kafka,snowflake,bigquery,redshift,mysql,postgres,s3-slim,gcs-slim,abs-slim,clickhouse,glue,dbt,looker,lookml,tableau,powerbi,superset,datahub-business-glossary]"
        - name: clean python cache and tests
          runs: |
            set -eux -o pipefail

            find ${target.dir}/usr/lib/datahub-ingestion \
              \( -type d -a \( -name __pycache__ -o -name test -o -name tests \) \) \
              -prune -exec rm -rf '{}' + || true
            find ${target.dir}/usr/lib/datahub-ingestion -type f \
              \( -name '*.pyc' -o -name '*.pyo' \) -delete || true

            find ${target.dir}/usr/lib/datahub-ingestion -name requirements.txt -delete

            find ${target.dir}/usr/lib/datahub-ingestion -name METADATA -exec \
              sed -i '/^Requires-Dist: black/d' {} +
        - name: align pip vendored urllib3 with site packages
          runs: |
            set -eux -o pipefail

            sp="${target.dir}/usr/lib/datahub-ingestion/lib/python3.10/site-packages"
            set -- "$sp"/urllib3-*.dist-info/METADATA
            if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
              echo "expected exactly one urllib3 dist-info" >&2
              exit 1
            fi
            urllib3_ver=$(sed -n 's/^Version: //p' "$1" | head -n 1)
            dist_name=$(basename "$(dirname "$1")")
            dist_ver=${dist_name#urllib3-}
            dist_ver=${dist_ver%.dist-info}
            if [ "$dist_ver" != "$urllib3_ver" ]; then
              echo "urllib3 dist-info ${dist_ver} does not match METADATA ${urllib3_ver}" >&2
              exit 1
            fi

            rm -rf "$sp/pip/_vendor/urllib3"
            cp -a "$sp/urllib3" "$sp/pip/_vendor/urllib3"

            python3.10 - "$sp/pip/_vendor/vendor.txt" "$sp/pip/_vendor/bom.cdx.json" "$urllib3_ver" << 'PY'
            import json
            import sys

            vendor_path, bom_path, ver = sys.argv[1:]

            def version_tuple(value):
                core = value.split("+", 1)[0].split("-", 1)[0]
                parts = core.split(".")
                if len(parts) < 3 or not all(part.isdigit() for part in parts):
                    raise SystemExit("unexpected urllib3 version %s" % value)
                return tuple(int(part) for part in parts[:3])

            if version_tuple(ver) < (2, 8, 0):
                raise SystemExit("urllib3 %s is below the 2.8.0 override" % ver)

            with open(vendor_path) as handle:
                lines = handle.read().splitlines()
            replaced = 0
            updated_lines = []
            for line in lines:
                stripped = line.lstrip(" ")
                if stripped.startswith("urllib3=="):
                    indent = line[:len(line) - len(stripped)]
                    updated_lines.append("%surllib3==%s" % (indent, ver))
                    replaced += 1
                else:
                    updated_lines.append(line)
            if replaced != 1:
                raise SystemExit("expected one urllib3 pin in vendor.txt, found %s" % replaced)
            vendor_text = "\n".join(updated_lines) + "\n"
            if ("urllib3==%s" % ver) not in vendor_text:
                raise SystemExit("vendor.txt urllib3 pin was not updated")
            with open(vendor_path, "w") as handle:
                handle.write(vendor_text)

            with open(bom_path) as handle:
                original = handle.read()
            bom = json.loads(original)
            comps = [comp for comp in bom.get("components", []) if comp.get("name") == "urllib3"]
            if len(comps) != 1:
                raise SystemExit("expected one urllib3 component, found %s" % len(comps))
            comp = comps[0]
            old = comp.get("version")
            if not isinstance(old, str) or not old:
                raise SystemExit("urllib3 component has no version")
            others_before = [
                (item.get("name"), item.get("version"), item.get("purl"))
                for item in bom.get("components", [])
                if item.get("name") != "urllib3"
            ]
            old_ref = "pkg:pypi/urllib3@%s" % old
            new_ref = "pkg:pypi/urllib3@%s" % ver
            old_count = original.count(old_ref)
            if old_count < 1:
                raise SystemExit("bom is missing %s" % old_ref)
            comp["version"] = ver
            for key in ("purl", "bom-ref"):
                value = comp.get(key)
                if not isinstance(value, str) or not value.startswith("pkg:pypi/urllib3@"):
                    raise SystemExit("urllib3 %s is not a pypi purl" % key)
                comp[key] = new_ref

            def rewrite(node):
                if isinstance(node, dict):
                    return {key: rewrite(value) for key, value in node.items()}
                if isinstance(node, list):
                    return [new_ref if item == old_ref else rewrite(item) for item in node]
                if node == old_ref:
                    return new_ref
                return node

            rewritten = rewrite(bom)
            updated = next(item for item in rewritten["components"] if item.get("name") == "urllib3")
            if updated.get("version") != ver or updated.get("purl") != new_ref or updated.get("bom-ref") != new_ref:
                raise SystemExit("urllib3 component metadata was not updated")
            others_after = [
                (item.get("name"), item.get("version"), item.get("purl"))
                for item in rewritten.get("components", [])
                if item.get("name") != "urllib3"
            ]
            if others_before != others_after:
                raise SystemExit("non-urllib3 component metadata changed")
            rendered = json.dumps(rewritten)
            if old != ver and old_ref in rendered:
                raise SystemExit("stale %s remains in bom" % old_ref)
            if rendered.count(new_ref) < old_count:
                raise SystemExit("bom kept fewer urllib3 refs than it started with")
            with open(bom_path, "w") as handle:
                json.dump(rewritten, handle, indent=2)
                handle.write("\n")
            PY

            grep -F "urllib3==${urllib3_ver}" "$sp/pip/_vendor/vendor.txt"
            grep -F "pkg:pypi/urllib3@${urllib3_ver}" "$sp/pip/_vendor/bom.cdx.json"
            if grep -E 'urllib3==|pkg:pypi/urllib3@' "$sp/pip/_vendor/vendor.txt" "$sp/pip/_vendor/bom.cdx.json" | grep -v -F "urllib3==${urllib3_ver}" | grep -v -F "pkg:pypi/urllib3@${urllib3_ver}"; then
              echo "urllib3 metadata still names a different version" >&2
              exit 1
            fi
        - name: python dependencies sbom
          uses: sbom@v1
          with:
            extra-scanners: python-package-cataloger
            prefix: datahub-ingestion
            source: ${target.dir}/usr/lib/datahub-ingestion
        - name: fix venv shebangs
          runs: |
            set -eux -o pipefail

            for f in "${target.dir}/usr/lib/datahub-ingestion/bin"/*; do
              [ -f "$f" ] || continue
              read -r line < "$f"
              case "$line" in
                "#!${target.dir}"*) sed -i "1s|#!${target.dir}|#!|" "$f" ;;
              esac
            done
        - name: create usr/bin symlink
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/usr/bin"
            test -e "${target.dir}/usr/lib/datahub-ingestion/bin/datahub"
            ln -sf ../lib/datahub-ingestion/bin/datahub "${target.dir}/usr/bin/datahub"
        - uses: dhi/build-pkg:0
          with:
            deb:
              depends:
                - ca-certificates
                - krb5-user
                - libaio1t64
                - libffi8
                - libkrb5-3
                - libldap2
                - libodbc2
                - librdkafka1
                - libsasl2-2
                - unixodbc
            depends:
              - python-3.10
            description: DataHub metadata ingestion framework
            files:
              - usr/lib/datahub-ingestion
              - usr/bin/datahub
            formats:
              - deb
            license: Apache-2.0
            name: datahub-ingestion
            rel: 1
            url: https://datahubproject.io/
            version: 1.7.0.16
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
