# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-rabbitmq
variant: runtime
tags:
  - 4.4.0
  - 4.4.0-r0
  - 4.4.0-debian13
  - 4.4.0-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2026-10-17"
vars:
  ERLANG_VERSION: 27.3.4.19
  PACKAGE_NAME: rabbitmq-4.4
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "4.4"
  SEMVER_MAJOR_VERSION: "4"
  SEMVER_VERSION: 4.4.0
  VERSION: 4.4.0
contents:
  packages:
    - base-files
  builds:
    - name: rabbitmq
      work-dir: ${source.dir}/erlang
      contents:
        packages:
          - base-files
          - binutils
          - bash
          - coreutils
          - gcc
          - grep
          - gzip
          - findutils
          - libc6-dev
          - libncurses-dev
          - libssl3t64
          - libssl-dev
          - make
          - openssl
          - perl
          - sed
          - tar
          - xz-utils
        files:
          - url: https://github.com/erlang/otp/releases/download/OTP-27.3.4.19/otp_src_27.3.4.19.tar.gz
            checksum: https://github.com/erlang/otp/releases/download/OTP-27.3.4.19/SHA256.txt
            path: ${source.dir}/erlang.tar.gz
            spdx:
              name: erlang
              version: 27.3.4.19
              packages:
                - name: erlang
                  purl: pkg:dhi/erlang@27.3.4.19
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: https://github.com/rabbitmq/signing-keys/releases/download/3.0/rabbitmq-release-signing-key.asc
            path: ${source.dir}/rabbitmq-signing-key-public.asc
            uid: 0
            gid: 0
          - url: https://github.com/rabbitmq/rabbitmq-server/releases/download/v4.4.0/rabbitmq-server-generic-unix-4.4.0.tar.xz.asc
            path: ${source.dir}/rabbitmq-sig.tar.xz.asc
            uid: 0
            gid: 0
          - url: https://github.com/rabbitmq/rabbitmq-server/releases/download/v4.4.0/rabbitmq-server-generic-unix-4.4.0.tar.xz
            path: ${source.dir}/rabbitmq-server-generic-unix-4.4.0.tar.xz
            spdx:
              name: rabbitmq
              version: 4.4.0
              packages:
                - name: rabbitmq
                  purl: pkg:dhi/rabbitmq@4.4.0
                  license: MPL-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: verify rabbitmq release
          uses: gpg/verify@v1
          with:
            file: ${source.dir}/rabbitmq-server-generic-unix-4.4.0.tar.xz
            keys: ${source.dir}/rabbitmq-signing-key-public.asc
            signature: ${source.dir}/rabbitmq-sig.tar.xz.asc
        - name: build and install erlang
          work-dir: ${source.dir}/erlang
          runs: |
            set -eux -o pipefail

            mkdir -p "${source.dir}/erlang"
            tar -xzf "${source.dir}/erlang.tar.gz" -C "${source.dir}/erlang" --strip-components=1
            ERL_TOP="$(pwd)"
            export ERL_TOP

            ./configure --prefix=/usr --with-ssl --without-jinterface --without-javac
            make -j"$(nproc)"
            make install DESTDIR="${target.dir}"
        - name: install rabbitmq
          runs: |
            set -eux -o pipefail

            install -d "${target.dir}/usr/lib/rabbitmq"
            tar -xJf "${source.dir}/rabbitmq-server-generic-unix-4.4.0.tar.xz" \
              -C "${target.dir}/usr/lib/rabbitmq" --strip-components=1
            sed -i 's/SYS_PREFIX=\${RABBITMQ_HOME}/SYS_PREFIX=/g' \
              "${target.dir}/usr/lib/rabbitmq/sbin/rabbitmq-defaults"

            install -d "${target.dir}/usr/bin"
            for cmd in "${target.dir}/usr/lib/rabbitmq/sbin/"*; do
              name="$(basename "${cmd}")"
              ln -sf "../lib/rabbitmq/sbin/${name}" "${target.dir}/usr/bin/${name}"
            done
        - uses: dhi/build-pkg:0
          with:
            depends:
              - ca-certificates
              - libssl3t64
              - libtinfo6
              - openssl
            description: RabbitMQ open source message broker
            files:
              - usr/bin
              - usr/lib/erlang
              - usr/lib/rabbitmq
            formats:
              - deb
            license: MPL-2.0
            name: rabbitmq-4.4
            rel: 0
            url: https://www.rabbitmq.com/
            version: 4.4.0
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
