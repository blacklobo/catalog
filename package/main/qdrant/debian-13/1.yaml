# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-qdrant
variant: runtime
tags:
  - 1.19.2-0
  - 1.19.2-0-debian13
platforms:
  - linux/amd64
  - linux/arm64
dates:
  release: "2023-02-08"
vars:
  CARGO_VERSION: 1.98.1-0
  COMMIT_SHA: 016542aa5deb6c66380bb137badf73d54f742bde
  DHI_REL: "0"
  DHI_VERSION: 1.19.2-0
  GCC_VERSION: 14.2.0-19+dhi5
  NODEJS_VERSION: 24.22.0-0
  RUSTC_VERSION: 1.98.1-0
  VERSION: 1.19.2
  WEB_UI_COMMIT_SHA: a88bf748bac82215fcaeffa54708d634988555e2
  WEB_UI_VERSION: 0.2.19
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
    - gcc-14-base=14.2.0-19+dhi5
    - libgcc-s1=14.2.0-19+dhi5
  builds:
    - name: qdrant
      work-dir: ${source.dir}/qdrant-deb
      environment:
        GIT_COMMIT_ID: 016542aa5deb6c66380bb137badf73d54f742bde
      caches:
        - path: /root/.cargo
        - path: /root/.npm
      contents:
        repositories:
          - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
        keyring:
          - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
        packages:
          - bash
          - build-essential
          - cargo-1.98=1.98.1-0
          - cargo-auditable
          - ca-certificates
          - clang
          - cmake
          - coreutils
          - debhelper
          - dpkg-dev
          - findutils
          - git
          - libprotobuf-dev
          - libunwind-dev
          - lld
          - mawk
          - nodejs-24=24.22.0-0
          - npm
          - pkg-config
          - protobuf-compiler
          - rustc-1.98=1.98.1-0
          - sed
        files:
          - url: git+https://github.com/qdrant/qdrant.git#v1.19.2
            checksum: 016542aa5deb6c66380bb137badf73d54f742bde
            path: ${source.dir}/qdrant-src
            spdx:
              name: qdrant
              version: 1.19.2
              packages:
                - name: qdrant
                  purl: pkg:cargo/qdrant@1.19.2
                  license: Apache-2.0
            uid: 0
            gid: 0
          - url: git+https://github.com/qdrant/qdrant-web-ui.git#v0.2.19
            checksum: a88bf748bac82215fcaeffa54708d634988555e2
            path: ${source.dir}/qdrant-web-ui
            spdx:
              name: qdrant-web-ui
              version: 0.2.19
              packages:
                - name: qdrant-web-ui
                  purl: pkg:github/qdrant/qdrant-web-ui@0.2.19
                  license: Apache-2.0
            uid: 0
            gid: 0
      pipeline:
        - name: build web ui dashboard
          work-dir: ${source.dir}/qdrant-web-ui
          privileged: true
          runs: |
            set -eux -o pipefail

            npm pkg set dependencies.axios=^1.18.0
            npm pkg set \
              'overrides[tar]=7.5.19' \
              'overrides[js-yaml]=4.3.2' \
              'overrides[undici]=7.29.1' \
              'overrides[source-map-js]=1.2.2'
            rm -f package-lock.json
            npm install --ignore-scripts
            npm run build-qdrant

            rm -rf node_modules
        - name: web ui sbom
          uses: sbom@v1
          with:
            extra-scanners: javascript-lock-cataloger
            prefix: qdrant-web-ui
            source: ${source.dir}/qdrant-web-ui
        - name: bump cargo dependencies
          work-dir: ${source.dir}/qdrant-src
          privileged: true
          runs: |
            set -eux -o pipefail

            cargo update --package crossbeam-epoch --precise 0.9.20
            cargo update --package rand@0.8.5 --precise 0.8.6
            cargo update --package rand@0.9.2 --precise 0.9.3
            cargo update --package h2@0.4.14 --precise 0.4.16
            cargo update --package rustls --precise 0.23.46
            cargo update --package xxhash-rust@0.8.15 --precise 0.8.16
            cargo update --package quinn-proto@0.11.16 --precise 0.11.18

            cargo fetch
            pyroscope_src="$(find "${CARGO_HOME:-/root/.cargo}/registry/src" -type d -name pyroscope-2.1.1 | head -1)"
            cp -a "${pyroscope_src}" "${source.dir}/pyroscope-patched"
            sed -i 's/version = "0.39"/version = "=0.40.0"/' \
              "${source.dir}/pyroscope-patched/Cargo.toml"
            sed -i "/branch = \"v0.14.6-qdrant\" }/a pyroscope = { path = \"${source.dir}/pyroscope-patched\" }" Cargo.toml

            cargo update --package pyroscope
            cargo update --package object@0.40.0 --precise 0.40.0
            cargo update --package ruzstd --precise 0.9.1
        - name: build
          work-dir: ${source.dir}/qdrant-src
          privileged: true
          runs: |
            set -eux -o pipefail

            cargo auditable build --release --locked --bin qdrant --features deb,stacktrace

            install -D -m 0755 target/release/qdrant \
              '${source.dir}/qdrant-deb/payload/usr/bin/qdrant'
        - name: stage config
          work-dir: ${source.dir}/qdrant-src
          runs: |
            set -eux -o pipefail

            install -d '${source.dir}/qdrant-deb/payload/usr/share/qdrant/config'
            cp config/config.yaml '${source.dir}/qdrant-deb/payload/usr/share/qdrant/config/'
            cp config/production.yaml '${source.dir}/qdrant-deb/payload/usr/share/qdrant/config/'
        - name: vendor web ui dashboard
          runs: |
            set -eux -o pipefail

            install -d '${source.dir}/qdrant-deb/payload/usr/share/qdrant/static'
            cp -r '${source.dir}/qdrant-web-ui/dist/'* '${source.dir}/qdrant-deb/payload/usr/share/qdrant/static/'
            cp '${source.dir}/qdrant-src/docs/redoc/master/openapi.json' \
              '${source.dir}/qdrant-deb/payload/usr/share/qdrant/static/openapi.json'
        - uses: dpkg/bump@v1
          with:
            changelog:
              - Bump Cargo rustls to 0.23.46; keep object 0.40.0 and ruzstd 0.9.1 for RUSTSEC-2026-0344.
            version: 1.19.2-0
        - uses: dpkg/build@v1
          privileged: true
          with:
            args: -b -uc -us -d
      paths:
        - type: directory
          path: ${source.dir}/qdrant-deb/debian
          uid: 0
          gid: 0
          mode: "0600"
          source: package/main/qdrant/debian-13/debian
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
