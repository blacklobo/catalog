            ldflags:
              - -X github.com/cli/cli/v2/internal/build.Version=2.103.2
              - -X github.com/cli/cli/v2/internal/build.Date=$(date -ud @${SOURCE_DATE_EPOCH} +'%Y-%m-%d')
