# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-nvidia-fs
variant: runtime
tags:
  - 2.31.5
  - 2.31.5-r0
  - 2.31.5-debian13
  - 2.31.5-r0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  COMMIT_SHA: 6a65099b667e1838109952a87dcc6c9414ebf81f
  PACKAGE_NAME: nvidia-fs-dkms-2
  REL: "0"
  SEMVER_MAJOR_MINOR_VERSION: "2.31"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.31.5
  VERSION: 2.31.5
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  packages:
    - base-files
  builds:
    - name: nvidia-fs
      work-dir: ${source.dir}
      contents:
        packages:
          - bash
          - coreutils
          - sed
        files:
          - url: git+https://github.com/NVIDIA/gds-nvidia-fs.git#v2.31.5
            checksum: 6a65099b667e1838109952a87dcc6c9414ebf81f
            path: ${source.dir}
            spdx:
              name: nvidia-fs
              version: 2.31.5
              packages:
                - name: nvidia-fs
                  purl: pkg:github/nvidia/gds-nvidia-fs@v2.31.5
                  license: MIT AND GPL-2.0-only
            uid: 0
            gid: 0
      pipeline:
        - name: stage nvidia-fs build tree
          runs: |
            set -eux -o pipefail

            tree="${target.dir}/usr/src/nvidia-fs-2.31.5"
            mkdir -p "${tree}" "${target.dir}/usr/share/doc/nvidia-fs-dkms-2"
            cp -a src/. "${tree}/"
            sed -i 's/^PACKAGE_VERSION=.*$/PACKAGE_VERSION="2.31.5"/' "${tree}/dkms.conf"
            cp LICENSE "${target.dir}/usr/share/doc/nvidia-fs-dkms-2/copyright"
        - name: stage sbom fragment
          runs: |
            set -eux -o pipefail

            mkdir -p "${target.dir}/opt/docker/sbom"
            cp -a /opt/docker/sbom/nvidia-fs "${target.dir}/opt/docker/sbom/"
        - uses: dhi/build-pkg:0
          with:
            deb:
              depends:
                - bash
                - binutils
                - coreutils
                - findutils
                - gcc
                - grep
                - kmod
                - make
                - mawk
                - sed
                - xz-utils
                - zstd
            description: NVIDIA GPUDirect Storage nvidia-fs kernel module source in DKMS layout
            files:
              - mode: "0755"
                path: usr/src/nvidia-fs-2.31.5/configure
              - mode: "0755"
                path: usr/src/nvidia-fs-2.31.5/create_nv.symvers.sh
              - mode: "0644"
                path: usr/src/nvidia-fs-2.31.5
              - mode: "0644"
                path: usr/share/doc/nvidia-fs-dkms-2/copyright
              - opt/docker/sbom
            formats:
              - deb
            license: MIT AND GPL-2.0-only
            name: nvidia-fs-dkms-2
            rel: 0
            url: https://github.com/NVIDIA/gds-nvidia-fs
            version: 2.31.5
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
