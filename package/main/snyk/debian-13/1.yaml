  SNYK_AMD64_CHECKSUM: sha256:eafe77550e44b9905fdf6c3ab1f583059274ba0c74284c7e03749d793fe66e73
  SNYK_ARM64_CHECKSUM: sha256:9660b10fea28245629c6d635e13f353973efa471b24865b38889777fbb7832b9
  SNYK_ASSET: '#{ target.arch == "arm64" ? "snyk-linux-arm64" : "snyk-linux" }'
  SNYK_CHECKSUM: '#{ target.arch == "arm64" ? "sha256:9660b10fea28245629c6d635e13f353973efa471b24865b38889777fbb7832b9" : "sha256:eafe77550e44b9905fdf6c3ab1f583059274ba0c74284c7e03749d793fe66e73" }'
  SNYK_FIPS_AMD64_CHECKSUM: sha256:98ee0762e7d394c8582516ff55d480dc00b52689658e20d386401507eb62b34b
  SNYK_FIPS_ARM64_CHECKSUM: sha256:5775910d12a08790ef1cc692272d8bdff5a4a846b5bc097ead971b4e8e8707e7
  SNYK_FIPS_CHECKSUM: '#{ target.arch == "arm64" ? "sha256:5775910d12a08790ef1cc692272d8bdff5a4a846b5bc097ead971b4e8e8707e7" : "sha256:98ee0762e7d394c8582516ff55d480dc00b52689658e20d386401507eb62b34b" }'
  VERSION: 1.1308.2
contents:
  packages:
    - '!base-files'
  builds:
    - name: snyk deb
      work-dir: ${source.dir}/snyk
      contents:
        packages:
          - debhelper
          - dpkg-dev
          - make
        files:
          - url: https://github.com/snyk/cli/releases/download/v1.1308.2/${SNYK_ASSET}
            checksum: ${SNYK_CHECKSUM}
            path: ${source.dir}/snyk/${SNYK_ASSET}
            uid: 0
            gid: 0
      pipeline:
        - name: stage binary
          runs: |
            set -eux -o pipefail

            install -m0755 "${SNYK_ASSET}" snyk
            rm -f "${SNYK_ASSET}"
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Build
            version: 1.1308.2-0
        - uses: dpkg/build@v1
          with:
            args: -b -uc -us -d
      paths:
        - type: directory
          path: ${source.dir}/snyk/debian
          uid: 0
          gid: 0
          mode: "0600"
          source: package/main/snyk/debian-13/debian
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
