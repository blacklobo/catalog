# syntax=dhi.io/build:2-debian13

image: dhi.io/pkg-snyk
variant: runtime
tags:
  - 1.1308.1-0
  - 1.1308.1-0-debian13
platforms:
  - linux/amd64
  - linux/arm64
vars:
  DHI_REL: "0"
  DHI_VERSION: 1.1308.1-0
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.1308.1
  SNYK_AMD64_CHECKSUM: sha256:a8b2e420af6d8e61bf1d367c064475ccf699d767fc8763efb0072b9cac250f9a
  SNYK_ARM64_CHECKSUM: sha256:bc80903433d94036698ac695d67e3fbbf49cae318adda970c3db23e95cd22d56
  SNYK_ASSET: '#{ target.arch == "arm64" ? "snyk-linux-arm64" : "snyk-linux" }'
  SNYK_CHECKSUM: '#{ target.arch == "arm64" ? "sha256:bc80903433d94036698ac695d67e3fbbf49cae318adda970c3db23e95cd22d56" : "sha256:a8b2e420af6d8e61bf1d367c064475ccf699d767fc8763efb0072b9cac250f9a" }'
  SNYK_FIPS_AMD64_CHECKSUM: sha256:5e3b0467b8dad05d76db14744511c0b7c2036e73b2bb7d6822d341e6a39d9f74
  SNYK_FIPS_ARM64_CHECKSUM: sha256:a3f96a8d878eeb97e68de60be28c8100bec940d37900d8e0ce61bd54fc46087f
  SNYK_FIPS_CHECKSUM: '#{ target.arch == "arm64" ? "sha256:a3f96a8d878eeb97e68de60be28c8100bec940d37900d8e0ce61bd54fc46087f" : "sha256:5e3b0467b8dad05d76db14744511c0b7c2036e73b2bb7d6822d341e6a39d9f74" }'
  VERSION: 1.1308.1
contents:
  packages:
    - '!base-files'
  builds:
    - name: snyk deb
      work-dir: ${source.dir}/snyk
      contents:
        packages:
          - debhelper
          - dpkg-dev
          - make
        files:
          - url: https://github.com/snyk/cli/releases/download/v1.1308.1/${SNYK_ASSET}
            checksum: ${SNYK_CHECKSUM}
            path: ${source.dir}/snyk/${SNYK_ASSET}
            uid: 0
            gid: 0
      pipeline:
        - name: stage binary
          runs: |
            set -eux -o pipefail

            install -m0755 "${SNYK_ASSET}" snyk
            rm -f "${SNYK_ASSET}"
        - uses: dpkg/bump@v1
          with:
            changelog:
              - DHI Build
            version: 1.1308.1-0
        - uses: dpkg/build@v1
          with:
            args: -b -uc -us -d
      paths:
        - type: directory
          path: ${source.dir}/snyk/debian
          uid: 0
          gid: 0
          mode: "0600"
          source: package/main/snyk/debian-13/debian
os-release:
  name: Docker Hardened Images (Debian)
  id: debian
  version-id: "13"
  version-codename: trixie
  pretty-name: Docker Hardened Images/Debian GNU/Linux 13 (trixie)
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/
