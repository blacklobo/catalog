  HARBOR_TRIVY_ADAPTER_REFERENCE: dhi/harbor-trivy-adapter:2.15.4-debian13@sha256:48e365b933d82800d29946460b27561321aa6a06ce6bf840b21e2150ac3030bb
  HELM_VERSION: 4.1.4-2
  NGINX_REFERENCE: dhi/nginx:1.31.8-debian13@sha256:753fe3647bae409f190946cb223a94a6b409ea7ff2ada224b1f0d53d76b4b264
  SEMVER_MAJOR_MINOR_VERSION: "1.19"
  SEMVER_MAJOR_VERSION: "1"
