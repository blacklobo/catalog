  HARBOR_CORE_REFERENCE: dhi/harbor-core:2.15.4-debian13@sha256:ad6b1581fbd40e9224472524f867aedb33ca3b8ffa511424a641723feedbc45b
  HARBOR_DB_REFERENCE: dhi/harbor-db:2.15.4-debian13@sha256:8a46349031169f50eebaf61cbf1871f20e402b7fb7e1281f096322495f19a83b
  HARBOR_EXPORTER_REFERENCE: dhi/harbor-exporter:2.15.4-debian13@sha256:a5fdd591d7c9d53ddffee2e43f18f57ff00e1c45c18bcb824278c5af47d524a2
  HARBOR_JOBSERVICE_REFERENCE: dhi/harbor-jobservice:2.15.4-debian13@sha256:37b7719cdfb930cb4673c31b620580ffd66923e81d44caae56e0e73234af1d9c
  HARBOR_PORTAL_REFERENCE: dhi/harbor-portal:2.15.4-debian13@sha256:e871ea71eb95208d0cdac4df761a58645063de04b90a928dbd657e57d63a22fc
