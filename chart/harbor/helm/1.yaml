  HARBOR_REGISTRY_REFERENCE: dhi/harbor-registry:2.15.4-debian13@sha256:4cac22cf12f08146b7fd1f39bf88eb83135f87719df5fd04e30a83cfdf7d7ccc
  HARBOR_REGISTRYCTL_REFERENCE: dhi/harbor-registryctl:2.15.4-debian13@sha256:3390acca3e777ed9d2ebd889decaedd775fc99b9d7f77005d4143297d8396f61
  HARBOR_TRIVY_ADAPTER_REFERENCE: dhi/harbor-trivy-adapter:2.15.4-debian13@sha256:4642843bcfe8029449d5a4a75cc098d55657ccf589a7792b4ea14127ad10cb0f
  HELM_VERSION: 4.1.4-2
  NGINX_REFERENCE: dhi/nginx:1.31.7-debian13@sha256:dec2af91058ec7fa2d0484d892bbf6afee788c6da8973d75cb67f650d302b173
  SEMVER_MAJOR_MINOR_VERSION: "1.19"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.19.4
  VERSION: 1.19.4
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: harbor-chart
      work-dir: ${source.dir}/harbor-helm
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - perl
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/goharbor/harbor-helm.git#v1.19.4
            checksum: 321159f4129ef8ccd4476047d4c96f582e2e036e
            path: ${source.dir}/harbor-helm
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: harbor-core
              description: Docker Hardened Images Helm chart for Harbor
              images:
                - name: harbor-core
                  ref: dhi/harbor-core:2.15.4-debian13@sha256:ad6b1581fbd40e9224472524f867aedb33ca3b8ffa511424a641723feedbc45b
                - name: harbor-jobservice
                  ref: dhi/harbor-jobservice:2.15.4-debian13@sha256:37b7719cdfb930cb4673c31b620580ffd66923e81d44caae56e0e73234af1d9c
                - name: harbor-registry
                  ref: dhi/harbor-registry:2.15.4-debian13@sha256:4cac22cf12f08146b7fd1f39bf88eb83135f87719df5fd04e30a83cfdf7d7ccc
                - name: harbor-registryctl
                  ref: dhi/harbor-registryctl:2.15.4-debian13@sha256:3390acca3e777ed9d2ebd889decaedd775fc99b9d7f77005d4143297d8396f61
                - name: harbor-trivy-adapter
                  ref: dhi/harbor-trivy-adapter:2.15.4-debian13@sha256:4642843bcfe8029449d5a4a75cc098d55657ccf589a7792b4ea14127ad10cb0f
                - name: harbor-exporter
                  ref: dhi/harbor-exporter:2.15.4-debian13@sha256:a5fdd591d7c9d53ddffee2e43f18f57ff00e1c45c18bcb824278c5af47d524a2
                - name: harbor-portal
                  ref: dhi/harbor-portal:2.15.4-debian13@sha256:e871ea71eb95208d0cdac4df761a58645063de04b90a928dbd657e57d63a22fc
                - name: harbor-db
                  ref: dhi/harbor-db:2.15.4-debian13@sha256:8a46349031169f50eebaf61cbf1871f20e402b7fb7e1281f096322495f19a83b
                - name: harbor-redis
                  ref: dhi/harbor-redis:2.15.4-debian13@sha256:c139fe6679680adcbc3a2eeb5040149734aafd85528a97530153f2ae4aea9014
                - name: nginx
                  ref: dhi/nginx:1.31.7-debian13@sha256:dec2af91058ec7fa2d0484d892bbf6afee788c6da8973d75cb67f650d302b173
              name: harbor-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/goharbor/harbor
            cmd: prepare
            registry: dhi.io
        - name: patch security contexts
          runs: |
            set -eux -o pipefail

            TMPL="${source.dir}/harbor-helm/templates"

            # Replace each pod-level securityContext block with a Helm {{- with }} block
            # sourced from values.yaml. The indentation is read dynamically from the
            # securityContext: line itself so the replacement is correct regardless of
            # nesting depth, and the block match consumes all deeper-indented lines so
            # it is resilient to new fields being added upstream.
            patch_security_context() {
              local file="$1" path="$2"
              perl -i -0pe \
                's/( +)securityContext:\n(\1 +[^\n]*\n)+/my ($i,$n)=($1,length($1)+2); "${i}{{- with .Values.'"${path}"' }}\n${i}securityContext:\n${i}  {{- toYaml . | nindent $n }}\n${i}{{- end }}\n"/ge' \
                "$file"
            }

            patch_security_context "$TMPL/core/core-dpl.yaml" "core.podSecurityContext"
            patch_security_context "$TMPL/exporter/exporter-dpl.yaml" "exporter.podSecurityContext"
            patch_security_context "$TMPL/jobservice/jobservice-dpl.yaml" "jobservice.podSecurityContext"
            patch_security_context "$TMPL/portal/deployment.yaml" "portal.podSecurityContext"
            patch_security_context "$TMPL/trivy/trivy-sts.yaml" "trivy.podSecurityContext"
            patch_security_context "$TMPL/nginx/deployment.yaml" "nginx.podSecurityContext"
            patch_security_context "$TMPL/registry/registry-dpl.yaml" "registry.podSecurityContext"
            patch_security_context "$TMPL/database/database-ss.yaml" "database.internal.podSecurityContext"
            patch_security_context "$TMPL/redis/statefulset.yaml" "redis.internal.podSecurityContext"
        - name: relocate chart
          uses: helm/rudder@v1
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/harbor/config
