vars:
  CHART_COMMIT_SHA: 321159f4129ef8ccd4476047d4c96f582e2e036e
  CHART_HELM_NAME: harbor-chart
  DHI_NAMESPACE: dhi
  DHI_PREFIX: ""
  DHI_REGISTRY: dhi.io
