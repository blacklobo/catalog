vars:
  CHART_COMMIT_SHA: 1b95eb091f73a692634797b3ea15766a6d454d57
  CHART_HELM_NAME: harbor-chart
  DHI_NAMESPACE: dhi
  DHI_PREFIX: ""
  DHI_REGISTRY: dhi.io
  DHI_SKIP_CONTEXT_COPY: "true"
  HARBOR_CORE_REFERENCE: dhi/harbor-core:2.15.4-debian13@sha256:bcb70cec7eda0e15f5c6c12765bd8011179da41fdbee23a37d8a10de19165d39
  HARBOR_DB_REFERENCE: dhi/harbor-db:2.15.4-debian13@sha256:8b861c5070aeb1d6b8f32a4dc39f887c61d25c19da7d324c14cdaa0ab26cb746
  HARBOR_EXPORTER_REFERENCE: dhi/harbor-exporter:2.15.4-debian13@sha256:ab01b6d48f799947b48f8a1647155bd605e557684f6c4a9161a86c415832c4a6
  HARBOR_JOBSERVICE_REFERENCE: dhi/harbor-jobservice:2.15.4-debian13@sha256:56a44d5b037ca38e376595477e138e10d3afb9b993062daa9b640c5d7aab8f1b
  HARBOR_PORTAL_REFERENCE: dhi/harbor-portal:2.15.4-debian13@sha256:3f07f25fd4e68eae7d803f4407e2b1a7b366d09f2febc5a2619bb6729683597c
  HARBOR_REDIS_REFERENCE: dhi/harbor-redis:2.15.4-debian13@sha256:09d01d9f96f28704e00f017bf734d4867c6c1fbddcdea88bb6f16a52e51c21d4
  HARBOR_REGISTRY_REFERENCE: dhi/harbor-registry:2.15.4-debian13@sha256:1521b8783210a6754170ba6788bf6561634060d898adfab873e20c57d3722af9
  HARBOR_REGISTRYCTL_REFERENCE: dhi/harbor-registryctl:2.15.4-debian13@sha256:2b7948de705afd709c74344c64aa724db09229cb5ee58dafd214e90822678560
  HARBOR_TRIVY_ADAPTER_REFERENCE: dhi/harbor-trivy-adapter:2.15.4-debian13@sha256:ecd5f12d0b35371234b1a4e1d090c7cc6d806c449bb1fbf3a4190194ec9f9c51
  HELM_VERSION: 4.1.4-2
  NGINX_REFERENCE: dhi/nginx:1.31.7-debian13@sha256:0f59fb1684b6e9b32a532f7769fb255d4bb7106ce4354ca413b59369b63a71df
  SEMVER_MAJOR_MINOR_VERSION: "1.19"
  SEMVER_MAJOR_VERSION: "1"
  SEMVER_VERSION: 1.19.2
  VERSION: 1.19.2
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: harbor-chart
      work-dir: ${source.dir}/harbor-helm
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - perl
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/goharbor/harbor-helm.git#v1.19.2
            checksum: 1b95eb091f73a692634797b3ea15766a6d454d57
            path: ${source.dir}/harbor-helm
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: harbor-core
              description: Docker Hardened Images Helm chart for Harbor
              images:
                - name: harbor-core
                  ref: dhi/harbor-core:2.15.4-debian13@sha256:bcb70cec7eda0e15f5c6c12765bd8011179da41fdbee23a37d8a10de19165d39
                - name: harbor-jobservice
                  ref: dhi/harbor-jobservice:2.15.4-debian13@sha256:56a44d5b037ca38e376595477e138e10d3afb9b993062daa9b640c5d7aab8f1b
                - name: harbor-registry
                  ref: dhi/harbor-registry:2.15.4-debian13@sha256:1521b8783210a6754170ba6788bf6561634060d898adfab873e20c57d3722af9
                - name: harbor-registryctl
                  ref: dhi/harbor-registryctl:2.15.4-debian13@sha256:2b7948de705afd709c74344c64aa724db09229cb5ee58dafd214e90822678560
                - name: harbor-trivy-adapter
                  ref: dhi/harbor-trivy-adapter:2.15.4-debian13@sha256:ecd5f12d0b35371234b1a4e1d090c7cc6d806c449bb1fbf3a4190194ec9f9c51
                - name: harbor-exporter
                  ref: dhi/harbor-exporter:2.15.4-debian13@sha256:ab01b6d48f799947b48f8a1647155bd605e557684f6c4a9161a86c415832c4a6
                - name: harbor-portal
                  ref: dhi/harbor-portal:2.15.4-debian13@sha256:3f07f25fd4e68eae7d803f4407e2b1a7b366d09f2febc5a2619bb6729683597c
                - name: harbor-db
                  ref: dhi/harbor-db:2.15.4-debian13@sha256:8b861c5070aeb1d6b8f32a4dc39f887c61d25c19da7d324c14cdaa0ab26cb746
                - name: harbor-redis
                  ref: dhi/harbor-redis:2.15.4-debian13@sha256:09d01d9f96f28704e00f017bf734d4867c6c1fbddcdea88bb6f16a52e51c21d4
                - name: nginx
                  ref: dhi/nginx:1.31.7-debian13@sha256:0f59fb1684b6e9b32a532f7769fb255d4bb7106ce4354ca413b59369b63a71df
              name: harbor-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/goharbor/harbor
            cmd: prepare
            registry: dhi.io
        - name: patch security contexts
          runs: |
            set -eux -o pipefail

            TMPL="${source.dir}/harbor-helm/templates"

            # Replace each pod-level securityContext block with a Helm {{- with }} block
            # sourced from values.yaml. The indentation is read dynamically from the
            # securityContext: line itself so the replacement is correct regardless of
            # nesting depth, and the block match consumes all deeper-indented lines so
            # it is resilient to new fields being added upstream.
            patch_security_context() {
              local file="$1" path="$2"
              perl -i -0pe \
                's/( +)securityContext:\n(\1 +[^\n]*\n)+/my ($i,$n)=($1,length($1)+2); "${i}{{- with .Values.'"${path}"' }}\n${i}securityContext:\n${i}  {{- toYaml . | nindent $n }}\n${i}{{- end }}\n"/ge' \
                "$file"
            }

            patch_security_context "$TMPL/core/core-dpl.yaml" "core.podSecurityContext"
            patch_security_context "$TMPL/exporter/exporter-dpl.yaml" "exporter.podSecurityContext"
            patch_security_context "$TMPL/jobservice/jobservice-dpl.yaml" "jobservice.podSecurityContext"
            patch_security_context "$TMPL/portal/deployment.yaml" "portal.podSecurityContext"
            patch_security_context "$TMPL/trivy/trivy-sts.yaml" "trivy.podSecurityContext"
            patch_security_context "$TMPL/nginx/deployment.yaml" "nginx.podSecurityContext"
            patch_security_context "$TMPL/registry/registry-dpl.yaml" "registry.podSecurityContext"
            patch_security_context "$TMPL/database/database-ss.yaml" "database.internal.podSecurityContext"
            patch_security_context "$TMPL/redis/statefulset.yaml" "redis.internal.podSecurityContext"
        - name: relocate chart
          uses: helm/rudder@v1
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/harbor/config
