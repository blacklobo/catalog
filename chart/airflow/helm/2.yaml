# syntax=dhi.io/build:2-helm3

name: Apache Airflow Helm chart 2.x
image: dhi.io/airflow-chart
variant: helm
tags:
  - 2.0.0
platforms:
  - linux/amd64
vars:
  AIRFLOW_REFERENCE: dhi/airflow:3.3.2-python3.13-debian13-compat@sha256:00c8a1901b106e9f57a6eec3346b46d4f2aeb38ca6f376798824124b7279a0e6
  APPVERSION: 3.3.2
  APPVERSION_MATCH: 3.3.2
  CHART_COMMIT_SHA: aa19d2dbb9ed187ec01957a92848d9b005e9ba9d
  CHART_HELM_NAME: airflow-chart
  DHI_NAMESPACE: dhi
  DHI_PREFIX: ""
  DHI_REGISTRY: dhi.io
  DHI_SKIP_CONTEXT_COPY: "true"
  GIT_SYNC_REFERENCE: dhi/git-sync:4.7.1-debian13@sha256:c224dde6a14487330129c31a8e00641e42885cc265ee8f1591abfef9020bd1ef
  HELM_VERSION: 4.1.4-2
  OPENTELEMETRY_COLLECTOR_REFERENCE: dhi/opentelemetry-collector:0.162.0-debian13-contrib@sha256:48889c5306b06b2517501ec3605e1b923200aabc21131e9c8818df60c13f1498
  PGBOUNCER_EXPORTER_REFERENCE: dhi/airflow-pgbouncer-exporter:0.21.0-debian13@sha256:ed53cf156c4c93d0d76801fcc942d5f20029292a04976cac5bf447ded6702bfb
  PGBOUNCER_REFERENCE: dhi/pgbouncer:1.25.2-debian13@sha256:39a136f73bc1587ef719c1ea59024a7c54ded91efc5e0991826bb5369994a622
  PROMETHEUS_STATSD_EXPORTER_REFERENCE: dhi/prometheus-statsd-exporter:0.31.0-debian13@sha256:87797da1dab679a1de5f5173db66088c725910d1627d8adebe0210fe4125a876
  REDIS_REFERENCE: dhi/redis:8.10.2-debian13-compat@sha256:8477e3456e63d1777b0df44658d8bb93b40ca0d0442df89222bd0ca4612b662f
  SEMVER_MAJOR_MINOR_VERSION: "2.0"
  SEMVER_MAJOR_VERSION: "2"
  SEMVER_VERSION: 2.0.0
  VERSION: 2.0.0
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: airflow
      work-dir: ${source.dir}/helm-charts/chart
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - yq-go
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/apache/airflow.git#3.3.2
            checksum: aa19d2dbb9ed187ec01957a92848d9b005e9ba9d
            path: ${source.dir}/helm-charts
            uid: 0
            gid: 0
      pipeline:
        - name: update chart dependencies
          uses: yq/patch@v1
          with:
            file: Chart.yaml
            patches:
              - del(.dependencies[] | select(.name == "postgresql"))
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: airflow
              dependencies: null
              description: Docker Hardened Images Helm chart for Apache Airflow
              images:
                - name: airflow
                  ref: dhi/airflow:3.3.2-python3.13-debian13-compat@sha256:00c8a1901b106e9f57a6eec3346b46d4f2aeb38ca6f376798824124b7279a0e6
                - name: prometheus-statsd-exporter
                  ref: dhi/prometheus-statsd-exporter:0.31.0-debian13@sha256:87797da1dab679a1de5f5173db66088c725910d1627d8adebe0210fe4125a876
                - name: pgbouncer
                  ref: dhi/pgbouncer:1.25.2-debian13@sha256:39a136f73bc1587ef719c1ea59024a7c54ded91efc5e0991826bb5369994a622
                - name: airflow-pgbouncer-exporter
                  ref: dhi/airflow-pgbouncer-exporter:0.21.0-debian13@sha256:ed53cf156c4c93d0d76801fcc942d5f20029292a04976cac5bf447ded6702bfb
                - name: git-sync
                  ref: dhi/git-sync:4.7.1-debian13@sha256:c224dde6a14487330129c31a8e00641e42885cc265ee8f1591abfef9020bd1ef
                - name: redis
                  ref: dhi/redis:8.10.2-debian13-compat@sha256:8477e3456e63d1777b0df44658d8bb93b40ca0d0442df89222bd0ca4612b662f
                - name: opentelemetry-collector
                  ref: dhi/opentelemetry-collector:0.162.0-debian13-contrib@sha256:48889c5306b06b2517501ec3605e1b923200aabc21131e9c8818df60c13f1498
              name: airflow-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/apache/airflow
              updateDependencies: true
            cmd: prepare
            registry: dhi.io
        - name: relocate chart
          uses: helm/rudder@v1
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: patch pgbouncer command
          runs: |
            set -eux -o pipefail

            yq -i '.pgbouncer.command = ["pgbouncer", "/etc/pgbouncer/pgbouncer.ini"]' values.yaml
        - name: lint
          uses: helm/cmd@v1
          with:
            chart: .
            cmd: lint .
        - name: package
          uses: helm/package@v1
          with:
            chart: .
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/airflow/config
