  VERSION: 2.15.1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: nats
      work-dir: ${source.dir}/helm-charts/helm/charts/nats
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/nats-io/k8s.git#nats-2.15.1
            checksum: f8d578086c4c44d011a5ff5a5285749e8f05f301
            path: ${source.dir}/helm-charts
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          with:
            chart:
              appRef: nats
              description: Docker Hardened Images Helm chart for NATS
              images:
                - name: nats
                  ref: dhi/nats:2.15.1-debian13@sha256:12337ee1d80d6168027197c392fa2c7d028f2d2c999765db6c346a5ea5516721
                - name: nats-server-config-reloader
                  ref: dhi/nats-server-config-reloader:0.25.0-debian13@sha256:0f5872a47258ee368fa7dabe8791fc908e4dfc8d2c644b9616edc5ae62a80701
                - name: prometheus-nats-exporter
                  ref: dhi/prometheus-nats-exporter:0.20.3-debian13@sha256:408377519996e1399d848376ae008fa1924b3a8bea18071898e6c9688e95be12
                - name: nats-box
