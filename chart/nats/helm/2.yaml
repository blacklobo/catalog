              description: Docker Hardened Images Helm chart for NATS
              images:
                - name: nats
                  ref: dhi/nats:2.15.1-debian13@sha256:4ee529060972956c3ad3283ff7ec4fb2456af7229601778a686136ea36b2d7f7
                - name: nats-server-config-reloader
