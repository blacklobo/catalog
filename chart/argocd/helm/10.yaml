# syntax=dhi.io/build:2-helm3

name: Argo CD Helm chart 10.x
image: dhi.io/argocd-chart
variant: helm
tags:
  - 10.10.5
platforms:
  - linux/amd64
vars:
  ARGOCD_REFERENCE: dhi/argocd:3.5.5-debian13@sha256:aebf9df6960d2642afe24a2ab69e925040ee28dedbd392918704d2e3e54e32ae
  CHART_COMMIT_SHA: 3d4228871ef2f98cbcd22d9f54f8265213cf0870
  CHART_HELM_NAME: argocd-chart
  DEX_REFERENCE: dhi/dex:2.46.0-debian13@sha256:54826e157f23855f2ae97ec1064789d8abe538b7181393de51da870ac8e1de3e
  DHI_NAMESPACE: dhi
  DHI_PREFIX: ""
  DHI_REGISTRY: dhi.io
  DHI_SKIP_CONTEXT_COPY: "true"
  HAPROXY_CHART_REFERENCE: dhi/haproxy-chart:1.30.2@sha256:29993d27fa09072484e1c92a63f6d7f1a512890224e138ff50b489fc8c07b8f5
  HELM_VERSION: 4.1.4-2
  REDIS_CHART_REFERENCE: dhi/redis-chart:23.0.7@sha256:05fa052dc4ce52f164ae9561737eea1c30b246ae768fe55ac4e6322a3b02ab14
  REDIS_EXPORTER_REFERENCE: dhi/redis-exporter:1.94.0-debian13@sha256:4788a887168e2c74800cd879842e5667099de4c0640308198af09d614a3b15ea
  REDIS_REFERENCE: dhi/redis:8.10.2-debian13-compat@sha256:8477e3456e63d1777b0df44658d8bb93b40ca0d0442df89222bd0ca4612b662f
  SEMVER_MAJOR_MINOR_VERSION: "10.10"
  SEMVER_MAJOR_VERSION: "10"
  SEMVER_VERSION: 10.10.5
  VERSION: 10.10.5
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: argocd
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - sed
          - yq-go
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/argoproj/argo-helm#argo-cd-10.10.5
            checksum: 3d4228871ef2f98cbcd22d9f54f8265213cf0870
            path: ${source.dir}/helm-charts
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          work-dir: ${source.dir}/helm-charts/charts/argo-cd
          with:
            chart:
              appRef: argocd
              dependencies:
                - alias: redis-ha
                  condition: redis-ha.enabled
                  name: redis-ha
                  ref: dhi/redis-chart:23.0.7@sha256:05fa052dc4ce52f164ae9561737eea1c30b246ae768fe55ac4e6322a3b02ab14
                - alias: haproxy
                  condition: haproxy.enabled
                  name: haproxy
                  ref: dhi/haproxy-chart:1.30.2@sha256:29993d27fa09072484e1c92a63f6d7f1a512890224e138ff50b489fc8c07b8f5
              description: Docker Hardened Images Helm chart for Argo CD
              images:
                - name: argocd
                  ref: dhi/argocd:3.5.5-debian13@sha256:aebf9df6960d2642afe24a2ab69e925040ee28dedbd392918704d2e3e54e32ae
                - name: dex
                  ref: dhi/dex:2.46.0-debian13@sha256:54826e157f23855f2ae97ec1064789d8abe538b7181393de51da870ac8e1de3e
                - name: redis
                  ref: dhi/redis:8.10.2-debian13-compat@sha256:8477e3456e63d1777b0df44658d8bb93b40ca0d0442df89222bd0ca4612b662f
                - name: redis-exporter
                  ref: dhi/redis-exporter:1.94.0-debian13@sha256:4788a887168e2c74800cd879842e5667099de4c0640308198af09d614a3b15ea
              name: argocd-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/argoproj/argo-helm
            cmd: prepare
            registry: dhi.io
        - name: relocate chart
          uses: helm/rudder@v1
          work-dir: ${source.dir}/helm-charts/charts/argo-cd
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: update values
          uses: yq/patch@v1
          work-dir: ${source.dir}/helm-charts/charts
          with:
            file: argo-cd/values.yaml
            patches:
              - del(.redis-ha.image)
              - del(.redis-ha.exporter.image)
              - del(.redis-ha.exporter.tag)
              - del(.redis-ha.haproxy.image.repository)
              - del(.redis-ha.haproxy)
              - del(.redis-ha.redis.masterGroupName)
              - del(.redis-ha.redis.config)
              - del(.redis-ha.hardAntiAffinity)
              - del(.redis-ha.additionalAffinities)
              - del(.redis-ha.affinity)
              - del(.redis-ha.tolerations)
              - del(.redis-ha.topologySpreadConstraints)
              - del(.redis-ha.containerSecurityContext)
        - name: Patch templates
          work-dir: ${source.dir}/helm-charts/charts/argo-cd/templates
          runs: |
            set -eux -o pipefail

            sed -i 's/$redisHa.haproxy.enabled/.Values.haproxy.enabled/' _helpers.tpl
            # HAProxy is a sibling subchart (dhi/haproxy-chart); its Service name is haproxy.fullname, not
            # "{redis-ha fullname}-haproxy" as in the upstream embedded redis-ha chart.
            sed -i 's#        {{- printf "%s-haproxy" (include "redis-ha.fullname" $redisHaContext) | trunc 63 | trimSuffix "-" -}}#        {{- include "haproxy.fullname" (dict "Chart" (dict "Name" "haproxy") "Release" .Release "Values" .Values.haproxy) | trunc 63 | trimSuffix "-" -}}#' _helpers.tpl
            # redis-ha.fullname only exists in the upstream redis-ha chart; redis-chart does not define it.
            # Remaining upstream calls pass a redis-ha-scoped context; use the appended helper with root context.
            sed -i 's#include "redis-ha.fullname" \$redisHaContext#include "argo-cd.redis-ha.fullname" .#' _helpers.tpl
            # redis-chart has no top-level authKey (upstream redis-ha value); the password key lives in auth.existingSecretPasswordKey.
            sed -i 's#key: {{ \$redisHa.authKey }}#key: {{ $redisHa.auth.existingSecretPasswordKey | default "auth" }}#' _helpers.tpl
            cat "${source.dir}/config/_helpers.redis-ha.append.tpl" >> _helpers.tpl
        - name: helm login
          uses: helm/login@v1
          with:
            registry: dhi.io
        - name: update dependencies
          uses: helm/cmd@v1
          work-dir: ${source.dir}/helm-charts/charts
          privileged: true
          with:
            chart: argo-cd
            cmd: dependency update
        - name: lint
          uses: helm/cmd@v1
          work-dir: ${source.dir}/helm-charts/charts
          with:
            chart: argo-cd
            cmd: lint .
        - name: package
          uses: helm/package@v1
          work-dir: ${source.dir}/helm-charts/charts
          with:
            chart: argo-cd
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/argocd/config
