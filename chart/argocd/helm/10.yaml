# syntax=dhi.io/build:2-helm3

name: Argo CD Helm chart 10.x
image: dhi.io/argocd-chart
variant: helm
tags:
  - 10.11.1
platforms:
  - linux/amd64
vars:
  ARGOCD_REFERENCE: dhi/argocd:3.5.6-debian13@sha256:d27d82447e2b046498424ad7d4b6b8f52b8850b71c3e06c8581bffb28af19d1d
  CHART_COMMIT_SHA: 28d06e552135394ed7b7753703f2b4f5b89122e5
  CHART_HELM_NAME: argocd-chart
  DEX_REFERENCE: dhi/dex:2.46.1-debian13@sha256:daeeacbfae9992b66d7706fc6edcf03ed3431b2abd1e644706bfb0d76e51f6a1
  DHI_NAMESPACE: dhi
  DHI_PREFIX: ""
  DHI_REGISTRY: dhi.io
  DHI_SKIP_CONTEXT_COPY: "true"
  HAPROXY_CHART_REFERENCE: dhi/haproxy-chart:1.30.2@sha256:c1e79c0824e23c417ac8b733e89446c6d826907c32a5c6ba1d4c1d49364cbd2e
  HELM_VERSION: 4.1.4-2
  REDIS_CHART_REFERENCE: dhi/redis-chart:23.0.7@sha256:4731142f14a6ce6673b716a0b8928d0e05c5cd68a1727e080184b14cda84ea77
  REDIS_EXPORTER_REFERENCE: dhi/redis-exporter:1.95.0-debian13@sha256:2cfd5eb735d1c6a1759ae87436088b45af3506a715d2e0a6f7c89839d0c1b6d3
  REDIS_REFERENCE: dhi/redis:8.10.2-debian13-compat@sha256:62f0464bb3a48bccf2064c0b793d98e08d2ad763ee60d6913ba18842fec5ce3d
  SEMVER_MAJOR_MINOR_VERSION: "10.11"
  SEMVER_MAJOR_VERSION: "10"
  SEMVER_VERSION: 10.11.1
  VERSION: 10.11.1
contents:
  repositories:
    - deb [signed-by=/usr/share/keyrings/dhi-deb-main.gpg] http://dhi.io/deb/debian/main trixie main
  keyring:
    - https://dhi.io/keyring/dhi-deb-gpg.D46852F6925E9F71.key
  builds:
    - name: argocd
      contents:
        packages:
          - bash
          - ca-certificates
          - coreutils
          - sed
          - yq-go
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/argoproj/argo-helm#argo-cd-10.11.1
            checksum: 28d06e552135394ed7b7753703f2b4f5b89122e5
            path: ${source.dir}/helm-charts
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          work-dir: ${source.dir}/helm-charts/charts/argo-cd
          with:
            chart:
              appRef: argocd
              dependencies:
                - alias: redis-ha
                  condition: redis-ha.enabled
                  name: redis-ha
                  ref: dhi/redis-chart:23.0.7@sha256:4731142f14a6ce6673b716a0b8928d0e05c5cd68a1727e080184b14cda84ea77
                - alias: haproxy
                  condition: haproxy.enabled
                  name: haproxy
                  ref: dhi/haproxy-chart:1.30.2@sha256:c1e79c0824e23c417ac8b733e89446c6d826907c32a5c6ba1d4c1d49364cbd2e
              description: Docker Hardened Images Helm chart for Argo CD
              images:
                - name: argocd
                  ref: dhi/argocd:3.5.6-debian13@sha256:d27d82447e2b046498424ad7d4b6b8f52b8850b71c3e06c8581bffb28af19d1d
                - name: dex
                  ref: dhi/dex:2.46.1-debian13@sha256:daeeacbfae9992b66d7706fc6edcf03ed3431b2abd1e644706bfb0d76e51f6a1
                - name: redis
                  ref: dhi/redis:8.10.2-debian13-compat@sha256:62f0464bb3a48bccf2064c0b793d98e08d2ad763ee60d6913ba18842fec5ce3d
                - name: redis-exporter
                  ref: dhi/redis-exporter:1.95.0-debian13@sha256:2cfd5eb735d1c6a1759ae87436088b45af3506a715d2e0a6f7c89839d0c1b6d3
              name: argocd-chart
              notes: ${source.dir}/config/NOTES.txt
              sourceUrl: https://github.com/argoproj/argo-helm
            cmd: prepare
            registry: dhi.io
        - name: relocate chart
          uses: helm/rudder@v1
          work-dir: ${source.dir}/helm-charts/charts/argo-cd
          with:
            cmd: patch
            patches:
              from: ${source.dir}/config
            registry: dhi.io
        - name: update values
          uses: yq/patch@v1
          work-dir: ${source.dir}/helm-charts/charts
          with:
            file: argo-cd/values.yaml
            patches:
              - del(.redis-ha.image)
              - del(.redis-ha.exporter.image)
              - del(.redis-ha.exporter.tag)
              - del(.redis-ha.haproxy.image.repository)
              - del(.redis-ha.haproxy)
              - del(.redis-ha.redis.masterGroupName)
              - del(.redis-ha.redis.config)
              - del(.redis-ha.hardAntiAffinity)
              - del(.redis-ha.additionalAffinities)
              - del(.redis-ha.affinity)
              - del(.redis-ha.tolerations)
              - del(.redis-ha.topologySpreadConstraints)
              - del(.redis-ha.containerSecurityContext)
        - name: Patch templates
          work-dir: ${source.dir}/helm-charts/charts/argo-cd/templates
          runs: |
            set -eux -o pipefail

            sed -i 's/$redisHa.haproxy.enabled/.Values.haproxy.enabled/' _helpers.tpl
            # HAProxy is a sibling subchart (dhi/haproxy-chart); its Service name is haproxy.fullname, not
            # "{redis-ha fullname}-haproxy" as in the upstream embedded redis-ha chart.
            sed -i 's#        {{- printf "%s-haproxy" (include "redis-ha.fullname" $redisHaContext) | trunc 63 | trimSuffix "-" -}}#        {{- include "haproxy.fullname" (dict "Chart" (dict "Name" "haproxy") "Release" .Release "Values" .Values.haproxy) | trunc 63 | trimSuffix "-" -}}#' _helpers.tpl
            # redis-ha.fullname only exists in the upstream redis-ha chart; redis-chart does not define it.
            # Remaining upstream calls pass a redis-ha-scoped context; use the appended helper with root context.
            sed -i 's#include "redis-ha.fullname" \$redisHaContext#include "argo-cd.redis-ha.fullname" .#' _helpers.tpl
            # redis-chart has no top-level authKey (upstream redis-ha value); the password key lives in auth.existingSecretPasswordKey.
            sed -i 's#key: {{ \$redisHa.authKey }}#key: {{ $redisHa.auth.existingSecretPasswordKey | default "auth" }}#' _helpers.tpl
            cat "${source.dir}/config/_helpers.redis-ha.append.tpl" >> _helpers.tpl
        - name: helm login
          uses: helm/login@v1
          with:
            registry: dhi.io
        - name: update dependencies
          uses: helm/cmd@v1
          work-dir: ${source.dir}/helm-charts/charts
          privileged: true
          with:
            chart: argo-cd
            cmd: dependency update
        - name: lint
          uses: helm/cmd@v1
          work-dir: ${source.dir}/helm-charts/charts
          with:
            chart: argo-cd
            cmd: lint .
        - name: package
          uses: helm/package@v1
          work-dir: ${source.dir}/helm-charts/charts
          with:
            chart: argo-cd
      paths:
        - type: directory
          path: ${source.dir}/config
          uid: 0
          gid: 0
          mode: "0644"
          source: chart/argocd/config
