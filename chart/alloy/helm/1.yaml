          - build-essential
          - coreutils
          - grep
          - libc-bin
          - sed
          - helm=4.1.4-2
        files:
          - url: git+https://github.com/grafana/alloy.git#helm-chart/1.14.0
            checksum: 1fd0188b6795e47c1618176eb60a35bc196f10da
            path: ${source.dir}/helm-charts
            uid: 0
            gid: 0
      pipeline:
        - name: prepare chart
          uses: helm/rudder@v1
          work-dir: ${source.dir}/helm-charts/operations/helm/charts/alloy
          with:
