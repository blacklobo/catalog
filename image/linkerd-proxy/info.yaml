metadata:
  display-name: Linkerd Proxy
  short-description: The Linkerd service mesh data plane proxy, with its identity agent and init-container tools.
  featured: false
  home-url: https://linkerd.io
  categories:
    - networking
  included-tools:
    - name: linkerd2-proxy-identity
      description: Entrypoint that generates the proxy key and certificate signing request, then starts the proxy.
    - name: linkerd-await
      description: Wrapper that waits for the proxy to become ready before running a command.
    - name: linkerd2-proxy-init
      description: Init container binary that redirects pod traffic through the proxy using iptables.
    - name: linkerd2-network-validator
      description: Init container tool that checks the traffic redirection before the proxy starts.
    - name: iptables
      description: Packet filtering tools that linkerd2-proxy-init drives.
